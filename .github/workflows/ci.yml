name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: windows-x86_64
            runner: windows-2022
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.platform }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies and test fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ fonts-dejavu-core fonts-liberation
      - name: Run Rust tests
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Verify the published crate builds with bundled HarfBuzz
        run: cargo package --locked
      - name: Run Python tests
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Parse the optional Office runner without launching Office
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/powerpoint_roundtrip.ps1).Path, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
