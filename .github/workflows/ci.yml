name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      office:
        description: Run on a dedicated self-hosted Windows desktop with PowerPoint
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: windows-x86_64
            runner: windows-2022
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.platform }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies and test fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev fonts-dejavu-core fonts-liberation
      - name: Locate macOS libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib" >> "$GITHUB_ENV"
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: Run Rust tests
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Run Python tests
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Parse the optional Office runner without launching Office
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/powerpoint_roundtrip.ps1).Path, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

  powerpoint:
    if: github.event_name == 'workflow_dispatch' && inputs.office
    # Hosted Windows runners do not include Office. This label must designate
    # an isolated runner started in an interactive Windows desktop session.
    runs-on: [self-hosted, Windows, X64, powerpoint]
    timeout-minutes: 30
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/powerpoint-qa-requirements.txt
      - run: cargo run --locked -- tests/fixtures/powerpoint/text-layout.typ --strict -o build/office-input.pptx
      - name: Render, save, edit native cell, and reopen in PowerPoint
        shell: powershell
        run: tools/powerpoint_roundtrip.ps1 -Presentation build/office-input.pptx -Manifest tests/fixtures/powerpoint/text-layout.json -OutputDirectory "build/office-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Check actual Office artifacts
        shell: pwsh
        run: |
          $dir = "build/office-${{ github.run_id }}-${{ github.run_attempt }}"
          python tools/powerpoint_qa.py --manifest tests/fixtures/powerpoint/text-layout.json --pptx "$dir/input.pptx" --pdf "$dir/powerpoint.pdf" --roundtrip-pptx "$dir/roundtrip.pptx" --edited-pptx "$dir/edited.pptx" --roundtrip-pdf "$dir/roundtrip.pdf" --edited-pdf "$dir/edited.pdf" --office-evidence "$dir/office-evidence.json" --require-office --output "$dir/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powerpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/office-*
