[package]
name = "typptx"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Export Typst documents to structurally editable PowerPoint presentations"
license = "MIT"
repository = "https://github.com/rice8y/typptx"
readme = "README.md"
include = ["/src/**", "/build.rs", "/vendor/**", "/tests/**", "/tools/**", "/docs/assets/**", "/README.md", "/LICENSE", "/Cargo.lock"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
codex = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime"] }
typst-svg = "=0.15.1"
typst-render = "=0.15.1"
usvg = "=0.47.0"
tempfile = "3"
ooxmlsdk = { version = "=0.13.1", features = ["validators"] }
write-fonts = { version = "=0.48.1", features = ["read"] }
i_overlay = "=8.1.0"
kurbo = "=0.13.1"
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.8"
unicode-segmentation = "=1.13.3"

[build-dependencies]
cc = "1"

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
